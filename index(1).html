<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#034694">
<title>Meu Quadro</title>
<style>
:root{--bg:#f2f6fc;--panel:#fff;--ink:#17243a;--muted:#718096;--line:#dfe8f3;--accent:#034694}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{background:linear-gradient(135deg,#034694,#0b65bd);color:#fff;padding:25px 20px 22px;border-radius:0 0 26px 26px;box-shadow:0 8px 22px #03469430}
.top{max-width:1000px;margin:auto}.eyebrow{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:#d7e8ff;font-weight:800}.headrow{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:10px}.brand{display:flex;align-items:center;gap:12px;min-width:0}.brandmark{width:48px;height:48px;flex:0 0 48px;border-radius:15px;background:#fff;color:#034694;display:grid;place-items:center;font-weight:900;font-size:18px;letter-spacing:-1px;box-shadow:0 4px 13px #002b5c55}h1{font-size:27px;margin:0;letter-spacing:-.7px}.sub{color:#dceaff;margin:7px 0 0;font-size:13px}.add{border:0;border-radius:14px;background:#fff;color:#034694;font-weight:800;padding:12px 15px;font-size:14px;white-space:nowrap}
main{max-width:1000px;margin:0 auto;padding:18px 15px 40px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:0 0 18px}.stat{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:13px}.stat b{display:block;font-size:22px;color:#034694}.stat span{font-size:11px;color:var(--muted)}
.toolbar{display:flex;gap:9px;margin-bottom:15px}.search{flex:1;min-width:0;border:1px solid var(--line);border-radius:12px;background:#fff;padding:12px 13px;font-size:14px}.filter{border:1px solid var(--line);border-radius:12px;background:#fff;padding:0 10px;color:#39465d}
.board{display:grid;grid-template-columns:1fr;gap:14px}.column{background:#e8f0fa;border:1px solid #dce8f6;border-radius:18px;padding:12px;min-height:125px}.colhead{display:flex;justify-content:space-between;align-items:center;margin:0 2px 11px;font-weight:750}.coltitle{display:flex;align-items:center;gap:8px}.dot{width:9px;height:9px;border-radius:50%}.count{font-size:12px;color:var(--muted);background:#fff;border-radius:20px;padding:3px 9px}.tasks{display:grid;gap:9px}.task{background:#fff;border:1px solid #e1eaf5;border-radius:14px;padding:13px;box-shadow:0 3px 10px #032d5f0d}.tasktop{display:flex;justify-content:space-between;gap:8px}.task h3{font-size:14px;margin:0 0 6px;line-height:1.35}.desc{font-size:12px;color:var(--muted);white-space:pre-wrap;line-height:1.4;margin:0 0 10px}.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}.pill{font-size:10px;padding:5px 8px;border-radius:20px;background:#edf3fb;color:#405775}.high{background:#fff0ef;color:#c34e48}.medium{background:#fff6df;color:#9b6b12}.low{background:#eaf6ef;color:#31794c}.due{font-size:10px;color:#69758a}.actions{display:flex;gap:6px;margin-top:11px}.actions button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 9px;font-size:11px;color:#034694}.empty{font-size:12px;color:#9aa4b5;text-align:center;padding:17px 5px}
footer{text-align:center;color:#899bb2;font-size:11px;padding:8px 15px 22px}dialog{border:0;border-radius:22px;padding:0;width:min(92vw,460px);box-shadow:0 25px 80px #10182755}dialog::backdrop{background:#10182788}.modal{padding:21px}.modal h2{margin:0 0 17px;font-size:19px}.field{display:grid;gap:6px;margin:12px 0}.field label{font-size:12px;font-weight:700;color:#566176}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:11px;padding:11px 12px;font:14px inherit;background:#fbfcfe;color:var(--ink)}.field textarea{min-height:75px;resize:vertical}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.modalactions{display:flex;gap:9px;margin-top:18px}.modalactions button{flex:1;border:0;border-radius:12px;padding:12px;font-weight:700}.cancel{background:#eef1f6;color:#4b5870}.save{background:var(--accent);color:#fff}
@media(min-width:720px){main{padding-top:22px}.board{grid-template-columns:repeat(3,minmax(0,1fr))}.column{min-height:300px}.stats{max-width:520px}}@media(max-width:390px){h1{font-size:23px}.brandmark{width:43px;height:43px;flex-basis:43px}.add{padding:11px 12px;font-size:13px}}
</style>
</head>
<body>
<header><div class="top"><div class="eyebrow">MEU ESPAÇO DE ORGANIZACAO</div><div class="headrow"><div class="brand"><div class="brandmark" aria-label="TH">TH</div><div><h1>Meu Quadro</h1><p class="sub">Um passo de cada vez. Organize e acompanhe.</p></div></div><button class="add" id="newTask">＋ Nova tarefa</button></div></div></header>
<main><section class="stats"><div class="stat"><b id="total">0</b><span>Tarefas no total</span></div><div class="stat"><b id="doing">0</b><span>Em andamento</span></div><div class="stat"><b id="done">0</b><span>Concluídas</span></div></section>
<div class="toolbar"><input class="search" id="search" placeholder="⌕  Buscar tarefa..." aria-label="Buscar tarefa"><select class="filter" id="categoryFilter" aria-label="Filtrar categoria"><option value="">Todas</option><option>Trabalho</option><option>Pessoal</option><option>Estudos</option><option>Outros</option></select></div><section class="board" id="board"></section></main>
<footer>Seus dados ficam salvos neste iPhone, neste navegador.</footer>
<dialog id="editor"><form class="modal" id="taskForm"><h2 id="formTitle">Nova tarefa</h2><input type="hidden" id="taskId"><div class="field"><label for="title">Nome da tarefa *</label><input id="title" maxlength="90" required placeholder="Ex.: Organizar documentos"></div><div class="field"><label for="description">Detalhes (opcional)</label><textarea id="description" maxlength="500" placeholder="Anotações, informações ou próximos passos..."></textarea></div><div class="two"><div class="field"><label for="status">Status</label><select id="status"><option value="todo">A fazer</option><option value="doing">Fazendo</option><option value="done">Concluído</option></select></div><div class="field"><label for="priority">Prioridade</label><select id="priority"><option value="medium">Média</option><option value="high">Alta</option><option value="low">Baixa</option></select></div></div><div class="two"><div class="field"><label for="category">Categoria</label><select id="category"><option>Trabalho</option><option>Pessoal</option><option>Estudos</option><option>Outros</option></select></div><div class="field"><label for="due">Prazo</label><input id="due" type="date"></div></div><div class="modalactions"><button type="button" class="cancel" id="cancel">Cancelar</button><button type="submit" class="save">Salvar tarefa</button></div></form></dialog>
<script>
const KEY='meu-quadro-ios-v1';const statuses=[{id:'todo',name:'A fazer',color:'#9aa5b5'},{id:'doing',name:'Fazendo',color:'#034694'},{id:'done',name:'Concluído',color:'#35a36d'}];
let tasks=[];try{tasks=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){tasks=[]}
const $=id=>document.getElementById(id);const save=()=>localStorage.setItem(KEY,JSON.stringify(tasks));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=d=>{if(!d)return '';const [y,m,day]=d.split('-');return `Prazo: ${day}/${m}/${y}`};
function render(){const q=$('search').value.trim().toLowerCase(),cat=$('categoryFilter').value;$('total').textContent=tasks.length;$('doing').textContent=tasks.filter(t=>t.status==='doing').length;$('done').textContent=tasks.filter(t=>t.status==='done').length;
$('board').innerHTML=statuses.map(s=>{const list=tasks.filter(t=>t.status===s.id&&(!cat||t.category===cat)&&(!q||(t.title+' '+t.description).toLowerCase().includes(q)));return `<section class="column"><div class="colhead"><div class="coltitle"><i class="dot" style="background:${s.color}"></i>${s.name}</div><span class="count">${list.length}</span></div><div class="tasks">${list.length?list.map(t=>`<article class="task"><div class="tasktop"><h3>${esc(t.title)}</h3></div>${t.description?`<p class="desc">${esc(t.description)}</p>`:''}<div class="meta"><span class="pill">${esc(t.category)}</span><span class="pill ${t.priority}">${t.priority==='high'?'Alta':t.priority==='low'?'Baixa':'Média'}</span>${t.due?`<span class="due">${fmt(t.due)}</span>`:''}</div><div class="actions"><button data-edit="${t.id}">Editar</button><button data-next="${t.id}">${t.status==='todo'?'Iniciar':t.status==='doing'?'Concluir':'Reabrir'}</button><button data-delete="${t.id}">Excluir</button></div></article>`).join(''):'<div class="empty">Nenhuma tarefa por aqui.</div>'}</div></section>`}).join('')}
function openEditor(t){$('taskForm').reset();$('taskId').value=t?.id||'';$('formTitle').textContent=t?'Editar tarefa':'Nova tarefa';$('title').value=t?.title||'';$('description').value=t?.description||'';$('status').value=t?.status||'todo';$('priority').value=t?.priority||'medium';$('category').value=t?.category||'Trabalho';$('due').value=t?.due||'';$('editor').showModal();$('title').focus()}
$('newTask').onclick=()=>openEditor();$('cancel').onclick=()=>$('editor').close();
$('taskForm').onsubmit=e=>{e.preventDefault();const id=$('taskId').value;const t={id:id||String(Date.now()),title:$('title').value.trim(),description:$('description').value.trim(),status:$('status').value,priority:$('priority').value,category:$('category').value,due:$('due').value};if(!t.title)return;if(id)tasks=tasks.map(x=>x.id===id?t:x);else tasks.unshift(t);save();$('editor').close();render()};
$('board').onclick=e=>{const b=e.target.closest('button');if(!b)return;const id=b.dataset.edit||b.dataset.next||b.dataset.delete;const t=tasks.find(x=>x.id===id);if(!t)return;if(b.dataset.edit)openEditor(t);if(b.dataset.next){t.status=t.status==='todo'?'doing':t.status==='doing'?'done':'todo';save();render()}if(b.dataset.delete&&confirm('Excluir esta tarefa?')){tasks=tasks.filter(x=>x.id!==id);save();render()}};
$('search').oninput=render;$('categoryFilter').onchange=render;render();
</script></body></html>
